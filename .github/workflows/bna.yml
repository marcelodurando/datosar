name: Scrape BNA

on:
  schedule:
    - cron: "*/30 * * * *"

  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for triggering the workflow"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: scrape-bna
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bna/package-lock.json

      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bna/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        working-directory: bna
        run: npm ci

      - name: Install Chromium
        working-directory: bna
        run: npx playwright install --with-deps chromium

      - name: Run scraper
        working-directory: bna
        run: node scraper.mjs

      - name: Commit and push updated HTML
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Save the generated file outside the repo
          cp datos/bna.html /tmp/bna.html

          for i in 1 2 3; do
            echo "Attempt $i..."

            # Synchronize with latest main
            git fetch origin
            git reset --hard origin/main
            git clean -fd

            # Restore generated file
            mkdir -p datos
            cp /tmp/bna.html datos/bna.html

            git add datos/bna.html

            if git diff --cached --quiet; then
              echo "No changes."
              exit 0
            fi

            git commit -m "Update BNA HTML"

            if git push origin HEAD:main; then
              echo "Push successful."
              exit 0
            fi

            echo "Push failed. Waiting 5 seconds..."
            sleep 5
          done

          echo "Failed after 3 attempts."
          exit 1

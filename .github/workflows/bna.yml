name: Scrape BNA

on:
  schedule:
    - cron: "*/30 * * * *"

  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for triggering the workflow"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: scrape-bna
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Scrape BNA
        run: |
          mkdir -p datos

          cat > scraper.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const browser = await chromium.launch({
            headless: true
          });

          const page = await browser.newPage({
            viewport: { width: 1600, height: 900 }
          });

          console.log("Opening BNA...");

          await page.goto("https://bna.com.ar/Personas", {
            waitUntil: "networkidle",
            timeout: 120000
          });

          await page.waitForTimeout(5000);

          fs.writeFileSync("datos/bna.html", await page.content());

          console.log("Saved datos/bna.html");

          await browser.close();
          EOF

          node scraper.mjs

      - name: Commit and push updated HTML
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Save the freshly scraped file outside the repository
          cp datos/bna.html /tmp/bna.html

          for i in 1 2 3; do
            echo "========================="
            echo "Attempt $i"
            echo "========================="

            # Synchronize with the latest main
            git fetch origin
            git reset --hard origin/main
            git clean -fd

            # Restore the generated file
            mkdir -p datos
            cp /tmp/bna.html datos/bna.html

            git add datos/bna.html

            if git diff --cached --quiet; then
              echo "No changes detected."
              exit 0
            fi

            git commit -m "Update BNA HTML"

            if git push origin HEAD:main; then
              echo "Push successful."
              exit 0
            fi

            echo "Push failed because the remote changed."
            echo "Waiting 5 seconds before retrying..."
            sleep 5
          done

          echo "Failed after 3 attempts."
          exit 1
